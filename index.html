    <!-- SCRIPT PENGHITUNG KLIK SELL (3X KLIK UNTUK MUNCULIN NOTIF) -->

        let sellClickCount = 0;

        function handleSell() {
            sellClickCount++;

            // Jika dipencet 3 kali, tampilkan modal popup suspended

                const modal = document.getElementById("suspendedModal");
                if (modal) {
                    modal.classList.remove("hidden");
                }
            }
        }
